<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Luyện phỏng vấn 1:1 cùng AI với bộ câu hỏi cá nhân hoá theo CV và JD, phản hồi chi tiết sau mỗi buổi." />
  <meta name="theme-color" content="#8037f4" />
  <title>ProInterview</title>
  <link rel="icon" href="/favicon-32.png?v=9" type="image/png" sizes="32x32" />
  <link rel="icon" href="/favicon-192.png?v=9" type="image/png" sizes="192x192" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=9" />
  <link rel="manifest" href="/site.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <script>
    // Fix ReferenceError: timer is not defined in custom.min.js
    window.timer = window.timer || null;
    try {
      var savedTheme = localStorage.getItem("prointerview_workspace_theme");
      var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
      if (savedTheme === "light" || (savedTheme === "system" && !prefersDark)) {
        document.documentElement.dataset.workspaceTheme = "light";
      }
    } catch (e) {}
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
